# Single source of truth for the site navigation.
#
# Both themes/Compendium/layouts/partials/nav.html and
# themes/Compendium/layouts/_default/section.html range over this list.
# A label or link is edited HERE and nowhere else — the two templates used to
# carry hand-retyped copies, which is how "Covenant of the A.R.C." survived a
# green build after the content title had already been corrected.
#
# `url` is the canonical path; the "/" entry renders as the site base URL.
# `label` is the navigation form. Where it intentionally differs from a Part's
# canonical heading (shortened articles, nav-width phrasing), note it inline so
# the divergence is a recorded decision rather than drift.

