<!DOCTYPE html>
<html lang="{{ .Site.Params.lang | default "en" }}" class="light">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1A1A1A">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }} - {{ .Site.Title }}</title>
  <meta property="og:title" content="{{ .Title }} - TekTribe Chronicles">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:image" content="https://overseer.ae/images/TekTribe - Awakening [HD-1x1].PNG">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ .Title }} - TekTribe Chronicles">
  <meta name="twitter:description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="twitter:image" content="https://overseer.ae/images/TekTribe - Awakening [HD-1x1].PNG">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ "css/nav.css" | relURL }}">
  <style>
    @font-face {
      font-family: 'Jokerman';
      src: url('/fonts/Jokerman-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --primary: #4A7C59;
      --secondary: #8B6F47;
      --bg: #F5F1E6;
      --bg-alt: #E8E4D8;
      --text: #1A1A1A;
      --text-light: #555555;
      --text-muted: #888888;
      --accent: #00FFFF;
      --border: #E8E8E8;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #121212;
      --bg-alt: #1A1A1A;
      --text: #E0E0E0;
      --text-light: #B0B0B0;
      --text-muted: #666666;
      --accent: #66E0FF;
      --border: #2A2A2A;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      font-size: 17px;
    }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    .page-header { margin: 60px 0 40px; text-align: center; }
    .page-header h1 {
      font-family: 'Jokerman', 'Georgia', 'Merriweather', serif;
      font-size: 2.4rem; font-weight: 700; margin-bottom: 16px;
      line-height: 1.3; color: var(--primary);
    }
    .page-header .subtitle { color: var(--text-light); font-size: 1.1rem; margin-bottom: 32px; }
    .content {
      background: var(--bg-alt); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px; margin-bottom: 40px; box-shadow: var(--shadow);
    }
    .content h2 {
      font-family: 'Jokerman', 'Georgia', 'Merriweather', serif;
      font-size: 1.5rem; color: var(--primary); margin: 32px 0 16px;
    }
    .content h2:first-child { margin-top: 0; }
    .content h3 {
      font-family: 'Georgia', 'Merriweather', serif;
      font-size: 1.2rem; color: var(--primary); margin: 24px 0 12px;
    }
    .content p { color: var(--text-light); line-height: 1.8; margin-bottom: 16px; }
    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
    .content ul, .content ol { margin: 16px 0; padding-left: 24px; }
    .content li { color: var(--text-light); margin-bottom: 8px; }
    .content blockquote {
      border-left: 4px solid var(--primary);
      padding-left: 20px; margin: 24px 0;
      color: var(--text-light); font-style: italic;
    }
    footer {
      background: var(--bg-alt); border-top: 1px solid var(--border);
      padding: 40px 0; margin-top: 80px; text-align: center;
    }
    footer p { color: white; font-size: 0.95rem; margin: 8px 0; }
  </style>
</head>
<body>
  {{ partial "nav.html" . }}

  <div class="container">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      <p class="subtitle">{{ .Description }}</p>
    </header>

    <div class="content">
      {{ .Content }}
    </div>
  </div>

  <footer>
    <div class="container">
      <p>© 2026 TekTribe Chronicles. Compendium of the Collective.</p>
      <p style="font-size: 0.75rem; opacity: 0.7;">Decentralized • Sovereign • Collective</p>
    </div>
  </footer>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleMenu() {
      document.getElementById('main-nav').classList.toggle('open');
    }
    document.addEventListener('click', function(event) {
      const nav = document.getElementById('main-nav');
      const toggle = document.querySelector('.menu-toggle');
      if (!nav.contains(event.target) && !toggle.contains(event.target) && nav.classList.contains('open')) {
        nav.classList.remove('open');
      }
    });
  </script>
<script src="/js/registerSW.js"></script>
</body>
</html>
