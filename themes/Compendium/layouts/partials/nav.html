<!-- Unified Navigation Partial - Used on ALL pages -->
<button class="theme-toggle" onclick="toggleTheme()">🌙</button>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>

<nav id="main-nav">
  <div class="nav-container">
{{- range site.Data.nav.items }}
    <a href="{{ if eq .url "/" }}{{ $.Site.BaseURL }}{{ else }}{{ .url | relURL }}{{ end }}" {{ if eq $.RelPermalink .url }}class="active"{{ end }}>{{ .label }}</a>
{{- end }}
  </div>
</nav>
